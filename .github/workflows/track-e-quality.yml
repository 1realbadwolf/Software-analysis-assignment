name: Track E CI and quality gates

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      demo:
        description: Controlled gate demonstration (101 percent threshold)
        type: choice
        options: [none, coverage-gate, mutation-gate]
        default: none

permissions:
  contents: read

concurrency:
  group: track-e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Hybrid tests and enforced quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DEMO: ${{ inputs.demo || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install reproducible test tools
        run: python -m pip install -r ci/requirements.txt
      - name: Stage actual source and selected hybrid suite
        run: python ci/prepare_workspace.py
      - name: Verify the quality-gate failure handling
        run: python -m unittest discover -s ci -p test_quality_gate.py
      - name: Run unit and TDD regression cases
        working-directory: build/track_e
        run: >-
          python -m pytest tests/test_filters_mutation_v2.py tests/test_tdd_documented_cases.py tests/test_filters_ci_gaps.py
          -v --junitxml=../../reports/unit.xml
          --cov=rag_system.retrieval.filters --cov-branch
          --cov-report= --cov-report=json:../../reports/coverage.json
      - name: Run real LanceDB integration tests
        working-directory: build/track_e
        run: >-
          python -m pytest tests/test_integration_lancedb.py
          -v --junitxml=../../reports/integration.xml
          --cov=rag_system.retrieval.filters --cov-branch --cov-append
          --cov-report= --cov-report=json:../../reports/coverage.json
      - name: Run Gherkin BDD scenarios
        working-directory: build/track_e
        run: >-
          python -m pytest tests/test_metadata_filtering_bdd.py
          -v --junitxml=../../reports/bdd.xml
          --cov=rag_system.retrieval.filters --cov-branch --cov-append
          --cov-report=term-missing --cov-report=json:../../reports/coverage.json
          --cov-report=xml:../../reports/coverage.xml
      - name: Enforce statement and branch coverage gate
        run: python ci/gate.py coverage --demo "$DEMO"
      - name: Run mutation testing on current production source
        working-directory: build/track_e
        run: python -m mutmut run --max-children 2
      - name: Export mutation statistics
        working-directory: build/track_e
        run: python -m mutmut export-cicd-stats
          && cp mutants/mutmut-cicd-stats.json ../../reports/mutation_stats.json
      - name: Enforce mutation score gate
        run: python ci/gate.py mutation --demo "$DEMO"
      - name: Publish run summary
        if: always()
        run: python ci/write_summary.py
      - name: Record dependency versions
        if: always()
        run: |
          mkdir -p reports
          python -m pip freeze > reports/dependencies.txt
      - name: Preserve execution evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-e-evidence-${{ github.run_number }}-${{ inputs.demo || 'none' }}
          path: |
            reports/
            build/track_e/mutants/mutmut-stats.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish passing suite package
        uses: actions/upload-artifact@v4
        with:
          name: track-e-verified-suite-${{ github.run_number }}
          path: |
            rag_system/retrieval/filters.py
            tests/test_filters_mutation_v2.py
            tests/test_tdd_documented_cases.py
            tests/test_filters_ci_gaps.py
            tests/test_metadata_filtering_bdd.py
            tests/test_integration_lancedb.py
            tests/features/metadata_filtering.feature
            ci/
          retention-days: 30
